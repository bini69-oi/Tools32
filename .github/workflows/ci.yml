name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: '0.11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Установить shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          # Версия пиньётся нарочно: в apt Ubuntu лежит 0.9.0, и набор проверок
          # там отличается от того, на чём код писался. Пусть CI и рабочая
          # машина ругаются одинаково.
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
      - name: Проверить все скрипты
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf 'Проверяю %d файлов:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

  unit:
    name: юнит-тесты (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ['5']
    steps:
      - uses: actions/checkout@v4
      - name: Прогнать тесты
        run: bash tests/run.sh

  install-smoke:
    name: установка на ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Поставить зависимости проверок
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl iproute2 dnsutils git
      - uses: actions/checkout@v4
      - name: Скрипт запускается и видит систему
        run: |
          bash install.sh version
          bash install.sh versions
      - name: Предполётные проверки отрабатывают
        env:
          T32_STATE_DIR: /tmp/tools32-state
          T32_LOG_FILE: /tmp/tools32.log
        run: |
          set +e
          bash install.sh check panel
          code=$?
          set -e
          echo "код возврата: $code"
          # В контейнере :80/:443 свободны, места и памяти хватает — проверка
          # должна пройти. Ненулевой код здесь означает регрессию в preflight.
          test "$code" -eq 0
      - name: Тесты проходят и на целевой ОС
        run: bash tests/run.sh

  images:
    name: пины образов ещё существуют
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить каждый тег на Docker Hub
        run: bash tools/check-images.sh

  compose:
    name: compose валиден для всех сочетаний
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отрендерить шесть сочетаний и скормить их docker compose
        run: |
          # Это и есть защита от того, из-за чего у апстрима разъехались теги:
          # проверяются ВСЕ пути установки, а не тот, который правили последним.
          work=$(mktemp -d)
          cd "$work"
          cat > .env <<'ENV'
          APP_PORT=3000
          METRICS_PORT=3001
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=postgres
          REMNAWAVE_API_TOKEN=stub
          NODE_PORT=2222
          NODE_SECRET_KEY=stub
          ENV
          for role in panel node panel-node; do
            for proxy in nginx caddy; do
              bash "$GITHUB_WORKSPACE/install.sh" render "$role" "$proxy" > docker-compose.yml
              docker compose config -q
              echo "  ok  $role / $proxy"
            done
          done
